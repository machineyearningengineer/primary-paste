name: Package private preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/Licensing/package-lock.json
      - name: Install architecture-check prerequisite
        run: brew install ripgrep
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
      - run: ./Scripts/check.sh
      - run: python3 Scripts/release.py build --unsigned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Primary-Paste-UNSIGNED-PREVIEW
          path: |
            .artifacts/releases/*/*.zip
            .artifacts/releases/*/*.dmg
            .artifacts/releases/*/*.tar.gz
            .artifacts/releases/*/*.tgz
            .artifacts/releases/*/SHA256SUMS.txt
            .artifacts/releases/*/release.json
          if-no-files-found: error
          retention-days: 14
